name: Build and publish Mini ZekaCity

concurrency:
  group: mini-zeka-city-godot4-migration
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [godot4-migration]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'export_presets.cfg'
      - 'project.godot'
      - 'project.godot.*'
      - '.github/workflows/build-exports.yml'

permissions:
  actions: write
  contents: write

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1 editor and export templates
        run: |
          set -euxo pipefail
          mkdir -p /tmp/godot /tmp/godot-templates
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip 2>&1 | tee /tmp/godot-download-editor.log
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz 2>&1 | tee /tmp/godot-download-templates.log
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Import and validate converted Godot 4 project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log

      - name: Run game logic smoke tests
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "Mini ZekaCity logic smoke tests passed." /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-tests.log; then exit 1; fi

      - name: Exercise every menu page for runtime validation
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/godot-ui-tests.log
          grep -q "Mini ZekaCity UI smoke tests passed." /tmp/godot-ui-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-ui-tests.log; then exit 1; fi

      - name: Launch the actual main scene for runtime validation
        run: |
          set -o pipefail
          timeout 15s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --audio-driver Dummy --quit 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-main-scene.log; then exit 1; fi

      - name: Export HTML5 build
        run: |
          set -o pipefail
          mkdir -p build/web
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Web" build/web/index.html 2>&1 | tee /tmp/godot-export.log
          test -s build/web/index.html
          touch build/web/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          page = Path("build/web/index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace("\t\tbody {", "\t\tbody {\n\t\t\toverflow: hidden;\n\t\t\twidth: 100vw;\n\t\t\theight: 100vh;")
          # Keep Godot's own canvas sizing and device-pixel-ratio handling.
          # Forcing CSS width/height here can rescale the rendered canvas and blur text.
          html = html.replace("\t\t#canvas {", "\t\t#canvas {")
          page.write_text(html, encoding="utf-8")
          PY

      - name: Publish browser build for Render Static Site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: render-web
          publish_dir: build/web
          force_orphan: true
          commit_message: "Deploy Mini ZekaCity web build: ${{ github.sha }}"

      - name: Archive validated browser build
        uses: actions/upload-artifact@v4
        with:
          name: mini-zeka-city-web-build
          path: build/web
          retention-days: 14

      - name: Set up Java 17 and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a /tmp/android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # sdkmanager exits after accepting licenses; avoid pipefail treating yes SIGPIPE as failure.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

      - name: Install Android build dependencies
        run: |
          set -euxo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Install Android build template into the project
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          test -s "$TEMPLATE_DIR/android_source.zip"
          mkdir -p android/plugins android/build
          touch android/build/.gdignore
          printf '%s\n' '4.4.1.stable' > android/.build_version
          unzip -q -o "$TEMPLATE_DIR/android_source.zip" -d android/build
          chmod +x android/build/gradlew
          test -s android/build/build.gradle
          test -x android/build/gradlew
          echo "Godot Android Gradle template installed in android/build."

      - name: Export Android APK for device testing
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p build/android
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android - Myket" build/android/MiniZekaCity-debug.apk 2>&1 | tee /tmp/godot-android-export.log
          test -s build/android/MiniZekaCity-debug.apk

      - name: Preserve migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot4-migration-diagnostics
          path: |
            /tmp/godot-download-editor.log
            /tmp/godot-download-templates.log
            /tmp/godot-convert.log
            /tmp/godot-import.log
            /tmp/godot-tests.log
            /tmp/godot-ui-tests.log
            /tmp/godot-main-scene.log
            /tmp/godot-export.log
            /tmp/godot-android-template.log
            /tmp/godot-android-export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive Android APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: mini-zeka-city-android-debug-apk
          path: build/android/MiniZekaCity-debug.apk
          retention-days: 14

