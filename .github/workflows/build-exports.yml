name: Build Mini ZekaCity exports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '*.godot'
      - '*.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/build-exports.yml'

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Download Godot 3.6.3 editor and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_x11.64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.6.3-stable_x11.64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/3.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/templates/3.6.3.stable/"

      - name: Run game logic smoke tests
        run: |
          /tmp/godot/Godot_v3.6.3-stable_x11.64 --headless --path . --script res://tests/logic_smoke_test.gd

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF
          [gd_resource type="EditorSettings" load_steps=2 format=2]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export HTML5 build
        run: |
          mkdir -p build/web build/android
          /tmp/godot/Godot_v3.6.3-stable_x11.64 --headless --path . --export-debug "HTML5" build/web/index.html

      - name: Export Android debug APK
        run: |
          /tmp/godot/Godot_v3.6.3-stable_x11.64 --headless --path . --export-debug "Android" build/android/MiniZekaCity.apk

      - name: Package browser build
        run: |
          cd build
          zip -qr MiniZekaCity-Web.zip web

      - name: Upload test builds
        uses: actions/upload-artifact@v4
        with:
          name: Mini-ZekaCity-test-builds
          path: |
            build/android/MiniZekaCity.apk
            build/MiniZekaCity-Web.zip
          if-no-files-found: error
          retention-days: 14
