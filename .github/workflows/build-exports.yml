name: Build and publish Mini ZekaCity

concurrency:
  group: mini-zeka-city-export
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/build-exports.yml'

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Install virtual display for Godot editor
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Download Godot 3.6.3 editor and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_x11.64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.6.3-stable_x11.64
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/3.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/templates/3.6.3.stable/"

      - name: Run game logic smoke tests
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 90s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --script res://tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "Mini ZekaCity logic smoke tests passed." /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-tests.log; then exit 1; fi

      - name: Launch the actual main scene for runtime validation
        run: |
          set -o pipefail
          timeout 15s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --audio-driver Dummy --quit 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-main-scene.log; then exit 1; fi

      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF
          [gd_resource type="EditorSettings" load_steps=2 format=2]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export HTML5 build
        run: |
          mkdir -p build/web build/android
          xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --export-debug "HTML5" build/web/index.html
          touch build/web/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          page = Path("build/web/index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace("\t\tbody {", "\t\tbody {\n\t\t\toverflow: hidden;\n\t\t\twidth: 100vw;\n\t\t\theight: 100vh;")
          html = html.replace("\t\t#canvas {", "\t\t#canvas {\n\t\t\twidth: 100vw !important;\n\t\t\theight: 100vh !important;\n\t\t\tmax-width: 100vw;\n\t\t\tmax-height: 100vh;")
          page.write_text(html, encoding="utf-8")
          PY

      - name: Export Android debug APK
        run: |
          xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --export-debug "Android" build/android/MiniZekaCity.apk

      - name: Package browser build
        run: |
          cd build
          zip -qr MiniZekaCity-Web.zip web

      - name: Upload test builds
        uses: actions/upload-artifact@v4
        with:
          name: Mini-ZekaCity-test-builds
          path: |
            build/android/MiniZekaCity.apk
            build/MiniZekaCity-Web.zip
          if-no-files-found: error
          retention-days: 14

      - name: Remove stale Pages artifacts from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: Publish browser build for Render Static Site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: render-web
          publish_dir: build/web
          force_orphan: true
          commit_message: "Deploy Mini ZekaCity web build: ${{ github.sha }}"

      - name: Upload browser build to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish browser game
        id: deployment
        uses: actions/deploy-pages@v4
