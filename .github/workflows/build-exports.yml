name: Test and build Mini ZekaCity Android

concurrency:
  group: mini-zeka-city-android
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/build-exports.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install virtual display for Godot editor
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Download Godot 3.6.3 editor and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_x11.64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.6.3-stable_x11.64
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/3.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/templates/3.6.3.stable/"

      - name: Run game logic smoke tests
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --audio-driver Dummy --path . --script res://tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "Mini ZekaCity logic smoke tests passed." /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-tests.log; then exit 1; fi

      - name: Exercise every menu page for runtime validation
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --audio-driver Dummy --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/godot-ui-tests.log
          grep -q "Mini ZekaCity UI smoke tests passed." /tmp/godot-ui-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-ui-tests.log; then exit 1; fi

      - name: Launch the actual main scene for runtime validation
        run: |
          set -o pipefail
          timeout 15s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --audio-driver Dummy --quit 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-main-scene.log; then exit 1; fi

      - name: Export Android APK
        run: |
          mkdir -p build/android
          xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --export-debug "Android" build/android/MiniZekaCity.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniZekaCity-Android-APK
          path: build/android/MiniZekaCity.apk
          if-no-files-found: error
          retention-days: 14
