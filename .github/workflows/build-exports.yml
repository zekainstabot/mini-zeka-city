name: Test and build Mini ZekaCity Android

concurrency:
  group: mini-zeka-city-android
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'export_presets.cfg'
      - '.github/workflows/build-exports.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install virtual display for Godot editor
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Download Godot 3.6.3 editor and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_x11.64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v3.6.3-stable_x11.64
          wget -q https://github.com/godotengine/godot/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/3.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/templates/3.6.3.stable/"

      - name: Install Android SDK and Java for Godot export
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;34.0.0"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-3.tres" <<EOF
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources before Android export
        timeout-minutes: 5
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 4m xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --audio-driver Dummy --editor --import --path . --quit --verbose 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/godot-import.log; then exit 1; fi

      - name: Run game logic smoke tests
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --audio-driver Dummy --path . --script res://tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "Mini ZekaCity logic smoke tests passed." /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-tests.log; then exit 1; fi

      - name: Exercise every menu page for runtime validation
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --audio-driver Dummy --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/godot-ui-tests.log
          grep -q "Mini ZekaCity UI smoke tests passed." /tmp/godot-ui-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-ui-tests.log; then exit 1; fi

      - name: Launch the actual main scene for runtime validation
        run: |
          set -o pipefail
          timeout 15s xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --path . --audio-driver Dummy --quit 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-main-scene.log; then exit 1; fi

      - name: Configure Android release signing
        env:
          # Support both the original signing-secret names and the newer release-prefixed names.
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "Missing GitHub secret: ANDROID_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD" || { echo "Missing GitHub secret: ANDROID_RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "Missing GitHub secret: ANDROID_RELEASE_KEY_ALIAS"; exit 1; }
          mkdir -p build/android
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > build/android/release.keystore
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("export_presets.cfg")
          content = path.read_text()
          replacements = {
              'keystore/release=""': 'keystore/release="build/android/release.keystore"',
              'keystore/release_user=""': 'keystore/release_user=' + json.dumps(os.environ["ANDROID_RELEASE_KEY_ALIAS"]),
              'keystore/release_password=""': 'keystore/release_password=' + json.dumps(os.environ["ANDROID_RELEASE_KEYSTORE_PASSWORD"]),
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"Expected Android release setting not found: {old}")
              content = content.replace(old, new, 1)
          path.write_text(content)
          PY

      - name: Export Android Release APK
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p build/android
          echo "Starting Godot Android Release export..."
          timeout --signal=TERM --kill-after=30s 9m xvfb-run -a /tmp/godot/Godot_v3.6.3-stable_x11.64 --no-window --audio-driver Dummy --verbose --path . --export-release "Android" build/android/MiniZekaCity-Release.apk 2>&1 | tee /tmp/godot-android-export.log
          test -s build/android/MiniZekaCity-Release.apk
          echo "Release APK export completed."

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniZekaCity-Android-Release-APK
          path: build/android/MiniZekaCity-Release.apk
          if-no-files-found: error
          retention-days: 14
