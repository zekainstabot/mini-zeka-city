name: Build and publish Mini ZekaCity

concurrency:
  group: mini-zeka-city-godot4-migration
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main, godot4-migration]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'export_presets.cfg'
      - 'project.godot'
      - 'project.godot.*'
      - '.github/workflows/build-exports.yml'

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1 editor and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Convert the complete Godot 3 project to Godot 4
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --convert-3to4 40000 1000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Convert Mini ZekaCity project to Godot 4"
            git push origin HEAD:godot4-migration
          fi

      - name: Import and validate converted Godot 4 project
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run game logic smoke tests
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "Mini ZekaCity logic smoke tests passed." /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-tests.log; then exit 1; fi

      - name: Exercise every menu page for runtime validation
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/godot-ui-tests.log
          grep -q "Mini ZekaCity UI smoke tests passed." /tmp/godot-ui-tests.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-ui-tests.log; then exit 1; fi

      - name: Launch the actual main scene for runtime validation
        run: |
          set -o pipefail
          timeout 15s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --path . --audio-driver Dummy --quit 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-main-scene.log; then exit 1; fi

      - name: Export HTML5 build
        run: |
          mkdir -p build/web
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --path . --export-debug "Web" build/web/index.html
          touch build/web/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          page = Path("build/web/index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace("\t\tbody {", "\t\tbody {\n\t\t\toverflow: hidden;\n\t\t\twidth: 100vw;\n\t\t\theight: 100vh;")
          # Keep Godot's own canvas sizing and device-pixel-ratio handling.
          # Forcing CSS width/height here can rescale the rendered canvas and blur text.
          html = html.replace("\t\t#canvas {", "\t\t#canvas {")
          page.write_text(html, encoding="utf-8")
          PY

      - name: Remove stale Pages artifacts from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === "github-pages") {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: Publish browser build for Render Static Site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: render-web
          publish_dir: build/web
          force_orphan: true
          commit_message: "Deploy Mini ZekaCity web build: ${{ github.sha }}"

      - name: Upload browser build to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish browser game
        id: deployment
        uses: actions/deploy-pages@v4
