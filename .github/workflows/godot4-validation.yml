name: Godot 4 migration validation

on:
  workflow_dispatch:
  push:
    branches: [godot4-migration]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'project.godot'
      - '.github/workflows/godot4-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/godot
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Convert Godot 3 project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --convert-3to4 40000 1000000 2>&1 | tee /tmp/godot-convert.log

      - name: Import converted project
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ -x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 ]; then
            /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          fi

      - name: Preserve conversion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot4-conversion-diagnostics
          path: |
            /tmp/godot-convert.log
            /tmp/godot-import.log
          if-no-files-found: ignore
          retention-days: 14
