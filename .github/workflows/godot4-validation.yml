name: Godot 4 migration validation

on:
  workflow_dispatch:
  push:
    branches: [godot4-migration]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '*.godot'
      - '*.tscn'
      - 'project.godot'
      - '.github/workflows/godot4-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Convert custom boot splash to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -o assets/boot-splash.png assets/boot-splash.svg

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/godot
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Import converted project
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ -x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 ]; then
            /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee /tmp/godot-import.log
            if grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-import.log; then exit 1; fi
          fi

      - name: Run game logic smoke tests
        shell: bash
        timeout-minutes: 1
        run: |
          set -o pipefail
          timeout 25s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "Mini ZekaCity logic smoke tests passed." /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-tests.log; then exit 1; fi

      - name: Exercise every menu page
        shell: bash
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --audio-driver Dummy --path . --script res://tests/ui_smoke_test.gd 2>&1 | tee /tmp/godot-ui-tests.log
          grep -q "Mini ZekaCity UI smoke tests passed." /tmp/godot-ui-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-ui-tests.log; then exit 1; fi

      - name: Launch the actual main scene
        shell: bash
        run: |
          set -o pipefail
          timeout 15s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --audio-driver Dummy --quit 2>&1 | tee /tmp/godot-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-main-scene.log; then exit 1; fi

      - name: Preserve conversion diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: godot4-conversion-diagnostics
          path: |
            /tmp/godot-import.log
            /tmp/godot-tests.log
            /tmp/godot-ui-tests.log
            /tmp/godot-main-scene.log
          if-no-files-found: ignore
          retention-days: 14
